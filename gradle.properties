# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
# The Minecraft version is already part of the archive name, so this is the mod version on its own.
version=1.0.0
group=com.github.tacowasa059
java_version=17

# Common
minecraft_version=1.20.1
mod_name=PlayerCorpseBlock
mod_author=TACOWASA_059
mod_id=playercorpseblock
license=MIT
credits=
description=Leaves a lightweight corpse behind when a player dies. Corpses are block entities, not entities, and pile up into a mound.
minecraft_version_range=[1.20.1, 1.21)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
forge_loader_version_range=[47,)

# Development only, added to the dev runs of both loaders for testing
worldedit_version=7.2.15

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
